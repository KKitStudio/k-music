name: Release (Windows x64)

# 触发方式：
#   1) 推送版本标签  git tag v0.6.1 && git push origin v0.6.1  → 自动构建并发布 GitHub Release
#   2) 手动在 Actions 页面点 Run workflow  → 仅构建并上传 artifact（不建 Release），用于验证 CI
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & package (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          # windows-latest 默认就是 MSVC 目标，这里显式声明保证一致
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 复用本地打包脚本：
      #   [1] cargo build --release -p mt-gui -p mt-cli
      #   [2] build.rs 在编译期把 app/gui/frontend 同步到 dist/frontend
      #   [3] 把 mt-gui.exe → dist/k_music.exe、mt-cli.exe → dist/、删除旧 mt-gui.exe
      # （dist_readme.md 不在发布子集内，README 拷贝步会静默跳过；CI 产物不含中文说明，见下方说明）
      - name: Build & package into dist/
        shell: cmd
        run: tools\package_gui.bat

      # 打包成 zip（文件名带版本号；标签触发时为 v0.6.1，手动触发时为分支名）
      - name: Zip dist
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "k-music-$tag-windows-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip -Force
          echo "ARTIFACT=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 手动触发时也保留产物，便于验证
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: k-music-dist
          path: k-music-*.zip

      # 仅标签推送时创建 Release；release 说明默认自动生成（可发布后在 GitHub 编辑）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: K music ${{ github.ref_name }}
          files: k-music-*.zip
          generate_release_notes: true

# 备注（已知风险，首次跑后按需调整）：
#   - WebView2 SDK：Tauri 编译期会自动从网络下载 WebView2 SDK。GitHub Runner 有网络，
#     通常可正常拉取；若首次构建报「WebView2 SDK not found」，可加一步手动下载或缓存。
#   - 本机沙箱 TLS 限制：你本机正常 git push 不需要任何特殊参数。
