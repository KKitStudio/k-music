  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEEBE7"/>
      <stop offset="1" stop-color="#DBD6D0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <g font-family="'Segoe Script', 'Segoe Print', cursive" font-weight="700"
     fill="#4C4741" text-anchor="middle">
    <text x="300" y="470" font-size="400">K</text>
    <text x="530" y="700" font-size="235">music</text>
  </g>
  <g fill="none" stroke="#4C4741" stroke-linecap="round">
    <path d="M 130 806 C 290 852, 450 782, 590 812 C 720 840, 810 818, 880 762"
